services:
  - type: web
    name: duijitu
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /tmp/data
      - key: UPLOADS_DIR
        value: /tmp/uploads
      - key: HISTORY_SEED_FILE
        value: /opt/render/project/src/web/data/live-history.json
      - key: JWT_SECRET
        generateValue: true
      - key: MABANG_APP_KEY
        sync: false
      - key: MABANG_APP_TOKEN
        sync: false
