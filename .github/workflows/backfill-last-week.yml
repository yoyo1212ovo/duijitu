name: Backfill last week Mabang history

on:
  workflow_dispatch:
  schedule:
    # 2026-09-04 19:05 Asia/Shanghai = 11:05 UTC
    - cron: '5 11 4 9 *'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backfill last week by shipping time
        run: node scripts/backfill-mabang.js 2026-08-24 2026-08-30 2026-08-24 2026-08-30 shipping
        env:
          MABANG_APP_KEY: ${{ secrets.MABANG_APP_KEY }}
          MABANG_APP_TOKEN: ${{ secrets.MABANG_APP_TOKEN }}

      - name: Commit history changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f web/data/live-history.json
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "chore: backfill last week Mabang history"
            git push
          fi
