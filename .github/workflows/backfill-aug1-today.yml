name: Backfill Aug 1 through today

on:
  workflow_dispatch:
  schedule:
    # 2026-09-10 19:05 Asia/Shanghai = 11:05 UTC
    - cron: '5 11 10 9 *'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      MABANG_TIMEOUT_MS: 30000
      BACKFILL_RETRY_ATTEMPTS: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backfill Aug 1 through today by shipping time
        run: |
          END_DATE=$(TZ=Asia/Shanghai date +%F)
          node scripts/backfill-mabang.js 2026-08-01 "$END_DATE" 2026-08-01 "$END_DATE" shipping
        env:
          MABANG_APP_KEY: ${{ secrets.MABANG_APP_KEY }}
          MABANG_APP_TOKEN: ${{ secrets.MABANG_APP_TOKEN }}

      - name: Commit history changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f web/data/live-history.json
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "chore: backfill Aug 1 through today Mabang history"
            git push
          fi
