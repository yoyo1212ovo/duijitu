name: Archive Mabang live history

on:
  schedule:
    # 00:30 Asia/Shanghai, every day
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and archive history
        run: node scripts/archive-live-history.js
        env:
          MABANG_APP_KEY: ${{ secrets.MABANG_APP_KEY }}
          MABANG_APP_TOKEN: ${{ secrets.MABANG_APP_TOKEN }}

      - name: Commit history changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f web/data/live-history.json
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "chore: archive Mabang history"
            git push
          fi
